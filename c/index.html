<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>집약처 — 이 케이스, 약사들은 어떻게 처방했을까?</title>
<meta name="description" content="약사 집단지성 처방 앱 집약처. 케이스 영상을 보고 약사들의 처방과 의견을 확인하세요.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="집약처">
<meta property="og:title" content="이 케이스, 약사들은 어떻게 처방했을까?">
<meta property="og:description" content="약사 집단지성 처방 · 집약처 앱에서 확인하세요">
<meta property="og:image" content="https://deonaeum-1.github.io/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0E110F">
<link rel="icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  /* 공유 미리보기 — 앱에서 공유한 영상 링크(/c/?id=케이스)를 앱 없이 열었을 때 */
  :root{--bg:#0E110F;--ink:#F4F1EA;--sub:#A39C90;--coral:#E8826A}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink)}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
       min-height:100vh;display:flex;justify-content:center;padding:calc(16px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
  main{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px}
  .logo{align-self:center;display:flex;align-items:flex-end;font-family:"Black Han Sans",sans-serif;font-size:30px;line-height:1;letter-spacing:-.02em;color:#fff;text-decoration:none;padding:7px 0}
  /* 명함과 같은 집 — 글자 높이 1/3쯤, 기준선(글자 칸 아래 0.21em)에 붙음
     간격: '처' 오른쪽 빈칸 0.06em + 글자 간격 -0.02em 을 감안해 1.2px → 눈에 보이는 간격 0.08em */
  .logo svg{margin:0 0 6.3px 1.2px}
  /* 항상 9:16 — 화면이 낮으면 높이를 줄이고 폭도 같이 줄임 */
  .stage{position:relative;height:min(62vh,calc((min(100vw,420px) - 32px) * 16 / 9));aspect-ratio:9/16;border-radius:20px;overflow:hidden;background:#1B201D;align-self:center}
  .stage video{width:100%;height:100%;object-fit:cover;display:block}
  .title{font-family:"Black Han Sans",sans-serif;font-size:34px;line-height:1.1;letter-spacing:-.02em;text-align:center;color:#fff}
  .meta{text-align:center;color:var(--sub);font-size:14px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:16px;font-weight:800;font-size:16px;text-decoration:none}
  .open{background:#fff;color:#111}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .ghost{background:rgba(255,255,255,.08);color:#fff;font-size:14px;height:48px;border-radius:14px}
  .hint{text-align:center;color:var(--sub);font-size:12.5px;line-height:1.6}
  .foot{margin-top:6px;text-align:center;color:rgba(255,255,255,.4);font-size:11.5px;line-height:1.7}
  .foot a{color:rgba(255,255,255,.55)}
  .gone{text-align:center;color:var(--sub);padding:60px 0;font-size:15px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <a class="logo" href="/beta.html" aria-label="집약처">집약처<svg width="5.7" height="8" viewBox="0 0 10 14" aria-hidden="true"><polygon points="0,4 5,0 10,4 10,14 0,14" fill="#3CC27F"/></svg></a>

  <div id="card" style="display:flex;justify-content:center" hidden>
    <div class="stage"><video id="vid" playsinline controls preload="metadata"></video></div>
  </div>
  <h1 class="title" id="title" hidden></h1>
  <p class="meta" id="meta" hidden></p>
  <p class="gone" id="gone" hidden>지금은 볼 수 없는 케이스예요.</p>

  <a class="btn open" id="open" href="#">앱에서 약사들의 처방 보기</a>
  <p class="hint">앱이 없다면 아래에서 설치하세요 (베타 테스트 중)</p>
  <div class="row">
    <a class="btn ghost" data-link="ios">아이폰</a>
    <a class="btn ghost" data-link="android">안드로이드</a>
  </div>

  <p class="foot">약사 개인 의견이며, 특정 제품을 권하는 광고가 아닙니다.<br>
    <a href="/privacy.html">개인정보처리방침</a> · <a href="/terms.html">이용약관</a> · <a href="/support.html">고객지원</a></p>
</main>
<script src="/links.js"></script>
<script>
  const L = window.JYC;
  document.querySelectorAll('[data-link]').forEach(a => (a.href = L[a.dataset.link]));
  const id = (new URLSearchParams(location.search).get('id') || '').replace(/[^A-Za-z0-9_-]/g, '');
  const open = document.getElementById('open');
  open.href = id ? `${L.scheme}case/${id}` : L.scheme;

  // 조회수 — 앱과 같은 한국식 (1,204 · 1.2만)
  const fmt = n => n >= 1e4 ? `${Math.floor(n / 1e3) / 10}만` : Number(n).toLocaleString('ko-KR');
  const val = x => x && (x.stringValue ?? x.integerValue ?? x.booleanValue ?? x.doubleValue);

  // 케이스는 누구나 읽을 수 있음 (처방 내용은 로그인한 앱에서만)
  const gone = () => (document.getElementById('gone').hidden = false);
  if (!id) gone();
  else fetch(`https://firestore.googleapis.com/v1/projects/${L.project}/databases/(default)/documents/cases/${id}`)
    .then(r => (r.ok ? r.json() : null))
    .then(d => {
      const f = (d && d.fields) || {};
      if (!d || val(f.live) !== true) return gone();
      const title = val(f.title) || '집약처 케이스';
      document.title = `${title} — 집약처`;
      const t = document.getElementById('title'); t.textContent = title; t.hidden = false;
      const m = document.getElementById('meta'); m.textContent = `조회 ${fmt(Number(val(f.views) || 0))}`; m.hidden = false;
      const v = document.getElementById('vid');
      if (val(f.thumbUrl)) v.poster = val(f.thumbUrl);
      v.src = val(f.videoUrl);
      document.getElementById('card').hidden = false;
    })
    .catch(gone);
</script>
</body>
</html>
